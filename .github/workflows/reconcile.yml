# Reconciliação de pagamentos a cada hora (gratuito no GitHub Actions).
# Também mantém o projeto do Supabase Free ativo (ele pausa após 7 dias sem uso).
# Configuração: Settings > Secrets and variables > Actions
#   Variável  SITE_URL     ex.: https://www.seudominio.com.br
#   Segredo   CRON_SECRET  o mesmo valor configurado na hospedagem
name: Reconciliação de pagamentos

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar /api/cron/reconcile
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL ou CRON_SECRET não configurados — nada a fazer."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 --retry 2 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reconcile"
